name: recover text-search-view v1.6.1 publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-text-search-view-1.6.1.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/text-search-view
          ref: 37f07ff6c0764f3f896f9951b43389394fee3a8c
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
        env:
          GIT_TAG: v1.6.1
      - run: npm run build:static
      - name: Verify package identity
        run: |
          node -e "const packageJson = require('./.tmp/dist/package.json'); if (packageJson.name !== '@lvce-editor/text-search-view' || packageJson.version !== '1.6.1') process.exit(1)"
      - name: Publish package
        run: npm publish --access public
        working-directory: ./.tmp/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
